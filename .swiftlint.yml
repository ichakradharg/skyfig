included:
  - Sources
  - Tests
  - Examples

excluded:
  - Sources/Skyfig/Generated
  - .build

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - for_where
  - function_body_length
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - opening_brace
  - switch_case_alignment
  - trailing_comma

line_length:
  warning: 120
  error: 160

type_name:
  min_length: 2
  max_length: 50

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - x
    - y

opt_in_rules:
  - empty_count
  - implicitly_unwrapped_optional
  - sorted_imports

reporter: "xcode"
