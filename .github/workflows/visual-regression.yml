name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Record new baselines or verify the committed baselines
        required: true
        default: verify
        type: choice
        options:
          - verify
          - record
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Consumer screenshots
    runs-on: [self-hosted, macOS, skyfig-visual]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Record or verify consumer screenshots
        run: Scripts/verify-consumer-snapshots.sh "${{ inputs.mode || 'verify' }}"
