name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cache Swift package dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
      - name: Swift version
        run: swift --version
      - name: Validate package
        run: swift package dump-package >/dev/null
      - name: Build
        run: swift build
      - name: Test iOS consumer sample on iPhone
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          xcodebuild test \
            -project Examples/SkyfigConsumer/SkyfigConsumer.xcodeproj \
            -scheme SkyfigConsumer \
            -sdk iphonesimulator26.0 \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.0.1' \
            -only-testing:SkyfigConsumerUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Test iOS consumer sample on iPad
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          xcodebuild test \
            -project Examples/SkyfigConsumer/SkyfigConsumer.xcodeproj \
            -scheme SkyfigConsumer \
            -sdk iphonesimulator26.0 \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.0.1' \
            -only-testing:SkyfigConsumerUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Build package consumer smoke test
        run: swift run --package-path Examples/SkyfigPackageConsumer
      - name: Test
        run: swift test --parallel
      - name: Verify canonical and generated tokens
        shell: bash
        run: |
          set -euo pipefail
          swift run skyfig validate --input Tokens/skyfig.tokens.json
          swift run skyfig generate \
            --input Tokens/skyfig.tokens.json \
            --output Sources/Skyfig/Generated \
            --check
          git diff --check
      - name: Run CLI integration tests
        run: bash Scripts/test-cli-integration.sh

  documentation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cache Swift package dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
      - name: Build rendered documentation
        run: |
          output_path="$GITHUB_WORKSPACE/.build/docc-site"
          rm -rf "$output_path"
          swift package --allow-writing-to-directory "$output_path" \
            generate-documentation --target Skyfig --output-path "$output_path"
          test -f "$output_path/documentation/skyfig/index.html"
      - name: Check local Markdown links
        run: python3 Scripts/check-markdown-links.py

  swiftlint:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cache Swift package dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
      - name: Lint Swift source
        run: swift package plugin --allow-writing-to-package-directory swiftlint lint

  linux-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cache Swift package dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: |
          swift build
          swift test --parallel
      - name: Verify generator toolchain
        run: |
          swift run skyfig validate --input Tokens/skyfig.tokens.json
          swift run skyfig generate \
            --input Tokens/skyfig.tokens.json \
            --output Sources/Skyfig/Generated \
            --check
      - name: Run CLI integration tests
        run: bash Scripts/test-cli-integration.sh
      - name: Build package consumer smoke test
        run: swift run --package-path Examples/SkyfigPackageConsumer
      - name: Check local Markdown links
        run: python3 Scripts/check-markdown-links.py
