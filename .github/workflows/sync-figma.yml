name: Sync Figma tokens

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: figma-token-sync
  cancel-in-progress: false

env:
  BASE_BRANCH: ${{ github.event.repository.default_branch }}
  BOT_BRANCH: automation/figma-token-sync
  TOKEN_NAMESPACE: ${{ vars.SKYFIG_TOKEN_NAMESPACE || 'SkyfigTokens' }}

jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Figma variables
        shell: bash
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$FIGMA_ACCESS_TOKEN" ]] || { echo '::error::Missing FIGMA_ACCESS_TOKEN'; exit 1; }
          [[ "$FIGMA_FILE_KEY" =~ ^[A-Za-z0-9_-]+$ ]] || { echo '::error::Missing or invalid FIGMA_FILE_KEY'; exit 1; }
          response="$RUNNER_TEMP/figma-variables.json"
          if ! status="$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 90 \
            --proto '=https' --tlsv1.2 \
            --header "X-Figma-Token: $FIGMA_ACCESS_TOKEN" \
            --output "$response" --write-out '%{http_code}' \
            "https://api.figma.com/v1/files/$FIGMA_FILE_KEY/variables/local")"; then
            echo "::error::Figma Variables API request failed (HTTP ${status:-unknown}); check plan, scope, file access, and token expiry"
            exit 1
          fi
          [[ "$status" == 200 ]] || { echo "::error::Figma returned HTTP $status"; exit 1; }

      - name: Normalize, validate, generate, and test
        shell: bash
        run: |
          set -euo pipefail
          swift run -c release skyfig normalize-figma \
            --input "$RUNNER_TEMP/figma-variables.json" \
            --output Tokens/skyfig.tokens.json
          swift run -c release skyfig validate --input Tokens/skyfig.tokens.json
          swift run -c release skyfig generate \
            --input Tokens/skyfig.tokens.json \
            --output Sources/Skyfig/Generated \
            --namespace "$TOKEN_NAMESPACE"
          swift test --parallel
          git diff --check

      - name: Open or update draft pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BOT_BRANCH"
          git add -- Tokens/skyfig.tokens.json Sources/Skyfig/Generated

          existing="$(gh pr list --state open --base "$BASE_BRANCH" \
            --json number,headRefName,headRepositoryOwner,isCrossRepository \
            --jq 'map(select(.headRefName == "automation/figma-token-sync" and .isCrossRepository == false))[0].number // empty')"
          if git diff --cached --quiet; then
            if [[ -n "$existing" ]]; then
              gh pr close "$existing" --comment 'Closing because canonical and generated tokens now match the default branch.'
            fi
            echo 'No token changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m 'chore(tokens): sync from Figma'
          gh auth setup-git
          git fetch origin "refs/heads/$BOT_BRANCH:refs/remotes/origin/$BOT_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BOT_BRANCH"

          if [[ -z "$existing" ]]; then
            gh pr create --draft --base "$BASE_BRANCH" --head "$BOT_BRANCH" \
              --title 'chore(tokens): sync from Figma' \
              --body 'Automated Figma Variables sync. Review the canonical token diff and generated Swift before marking ready.'
          else
            gh pr view "$existing" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
          fi
