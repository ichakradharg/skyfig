name: iOS Consumer Build

on:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - Tokens/**
      - Sources/Skyfig/**
      - Examples/SkyfigConsumer/**
      - .github/workflows/ios-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build iOS consumer sample
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: |
          xcodebuild build \
            -project Examples/SkyfigConsumer/SkyfigConsumer.xcodeproj \
            -scheme SkyfigConsumer \
            -sdk iphonesimulator26.0 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
